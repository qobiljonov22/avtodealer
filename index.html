<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <script src="js/tailwindcss-browser.js"></script>
    <style type="text/tailwindcss">
        @theme {
            /* phone */ --breakpoint-sm: 640px;
            /* mini-ipad */ --breakpoint-md: 768px;
            /* ipad */ --breakpoint-lg: 1024px;
            /* laptop */ --breakpoint-xl: 1280px;
            /* desktop */ --breakpoint-2xl: 1536px;
            /* monitor */ --breakpoint-3xl: 1800px;
            /* large monitor */ --breakpoint-4xl: 1920px;
            /* ultra */ --breakpoint-5xl: 2000px;
        }
    </style>
</head>
